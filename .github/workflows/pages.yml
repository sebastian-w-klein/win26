# Publishes the game to GitHub Pages, so anyone with the URL can play a
# practice draft in a browser with no account and nothing to install.
#
# Live leagues do NOT work here: syncing picks between browsers needs a shared
# document store, which a static host cannot provide. This is the
# practice-draft build.
#
# Pages must be switched on once before the first run, at Settings -> Pages ->
# Build and deployment -> Source: GitHub Actions. configure-pages below asks
# for that itself, but a workflow's own token is usually not permitted to
# create the Pages site, and the run then fails with
# "Create Pages site failed: Resource not accessible by integration".
# Setting the source by hand once clears it for good; after that the
# enablement step finds the existing site and does nothing.
#
# The repository also has to be public, or on a plan that includes Pages for
# private repos. It prints the URL when it finishes.
#
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer one win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Deploy the BUNDLE, not the source tree. src/ui/map.js imports d3-geo and
      # topojson-client by bare specifier, which a browser cannot resolve on its
      # own; esbuild resolves them from node_modules. Serving src/ raw means that
      # one unresolvable import takes down the whole module graph and the page
      # renders blank with its title intact -- which is exactly what shipped the
      # first time this workflow ran green.
      - run: npm ci
      - name: Build the site
        run: |
          npm run build
          mkdir -p _site
          cp dist/standalone.html _site/index.html
          touch _site/.nojekyll

      # enablement: true turns Pages on for the repo on the first run, so
      # there is no Settings -> Pages step to do by hand first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
